spring.application.name=emotion-diary-server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

moodboard.max-elements=100
moodboard.max-content-json-bytes=5242880
moodboard.max-name-length=100

jwt.secret=${JWT_SECRET:my-super-secret-jwt-key-that-is-at-least-32-bytes-long}
jwt.expiration-ms=86400000

# Comma-separated browser origins for the SPA (production / docker).
# Leave empty in local dev to use allowed-origin-patterns instead.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
# Dev-friendly patterns: localhost, 127.0.0.1, and common LAN IPs (Vite host:true).
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*}
