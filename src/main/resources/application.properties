spring.application.name=emotion-diary-server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

moodboard.max-elements=100
moodboard.max-content-json-bytes=5242880

# Temporary auth debugging (remove or set to INFO when done)
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.authentication.www.BasicAuthenticationFilter=TRACE
